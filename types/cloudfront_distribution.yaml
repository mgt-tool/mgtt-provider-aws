description: AWS CloudFront CDN distribution. Facts are observed via `aws cloudfront get-distribution` and CloudWatch metrics.

# IAM grants required to probe this type. mgtt-core doesn't parse this
# block today; it's operator-facing documentation for scoping a
# probe-role policy. `{region}` / `{account}` / `{resource}` reference
# the target's coordinates — substitute before pasting into a policy.
requires:
  iam:
    - action: cloudfront:GetDistribution
      resource: "arn:aws:cloudfront::{account}:distribution/{resource}"
    - action: cloudwatch:GetMetricStatistics
      resource: "*"
      note: "CloudWatch metric reads do not support resource-scoped policies."

facts:
  deployed:
    type: mgtt.bool
    ttl: 300s
    cost: low
    access: AWS API read-only
  enabled:
    type: mgtt.bool
    ttl: 300s
    cost: low
    access: AWS API read-only
  error_rate_5xx:
    type: mgtt.percentage
    ttl: 60s
    cost: low
    access: AWS API read-only

healthy:
  - deployed == true
  - enabled == true
  - error_rate_5xx < 1

states:
  live:
    when: "deployed == true & enabled == true & error_rate_5xx < 1"
    description: distribution serving traffic at edge
  erroring:
    when: "error_rate_5xx >= 1"
    description: serving 5xx errors
  disabled:
    when: "enabled == false"
    description: distribution disabled
  deploying:
    when: "deployed == false & enabled == true"
    description: edge propagation in progress

default_active_state: live

failure_modes:
  erroring:
    can_cause: [origin_exposed, cache_miss, latency_spike]
  disabled:
    can_cause: [origin_exposed, cache_miss, latency_spike]
  deploying:
    can_cause: [stale_cache, inconsistent_response]
